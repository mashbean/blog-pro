<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">有備而來超商取貨的三層協定</title>
  <desc id="desc">手機皮夾先用 OID4VP 向官方驗證模組提出電信憑證，再由服務自訂 API 發出五分鐘 QR，最後交給超商既有 POS 掃描。</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c83ff"/>
      <stop offset="1" stop-color="#5f56e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a7a3bd"/>
    </marker>
  </defs>

  <rect width="1200" height="690" rx="38" fill="#0d0d12"/>
  <text x="64" y="72" fill="#f6f5fb" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="36" font-weight="700">不是一個協定，而是一座橋</text>
  <text x="64" y="112" fill="#aaa7b5" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="21">身分證明走 OID4VP；取貨權利仍要轉成既有超商掃描器認得的短效憑證</text>

  <g filter="url(#shadow)">
    <rect x="64" y="168" width="290" height="288" rx="30" fill="#1b1a22" stroke="#383542"/>
    <circle cx="116" cy="221" r="28" fill="url(#accent)"/>
    <path d="M104 221h24M116 209v24" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="156" y="214" fill="#f6f5fb" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="27" font-weight="700">有備而來</text>
    <text x="156" y="245" fill="#aaa7b5" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="19">持有電信憑證</text>
    <text x="94" y="304" fill="#d7d4e2" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="21">選擇性揭露</text>
    <text x="94" y="340" fill="#f6f5fb" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="28" font-weight="650">姓名＋手機末五碼</text>
    <text x="94" y="392" fill="#aaa7b5" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="18">卡片 holder key 簽署</text>
    <text x="94" y="421" fill="#aaa7b5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">nonce · state · transaction</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="168" width="290" height="288" rx="30" fill="#1b1a22" stroke="#383542"/>
    <circle cx="507" cy="221" r="28" fill="#2f8e6a"/>
    <path d="M494 221l9 9 18-20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="547" y="214" fill="#f6f5fb" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="27" font-weight="700">官方驗證模組</text>
    <text x="547" y="245" fill="#aaa7b5" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="19">查驗 VP 與交易</text>
    <text x="485" y="304" fill="#d7d4e2" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="21">服務端產生</text>
    <text x="485" y="340" fill="#f6f5fb" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="28" font-weight="650">五分鐘 QR PNG</text>
    <text x="485" y="392" fill="#aaa7b5" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="18">不是 App 自行編碼</text>
    <text x="485" y="421" fill="#aaa7b5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">transaction-bound · expires · server-issued</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="846" y="168" width="290" height="288" rx="30" fill="#1b1a22" stroke="#383542"/>
    <circle cx="898" cy="221" r="28" fill="#d88a32"/>
    <path d="M885 209h5v24h-5zm10 0h3v24h-3zm8 0h7v24h-7z" fill="#fff"/>
    <text x="938" y="214" fill="#f6f5fb" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="27" font-weight="700">超商 POS</text>
    <text x="938" y="245" fill="#aaa7b5" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="19">既有掃描設備</text>
    <text x="876" y="304" fill="#d7d4e2" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="21">辨識的是</text>
    <text x="876" y="340" fill="#f6f5fb" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="28" font-weight="650">取貨授權，不是 VP</text>
    <text x="876" y="392" fill="#aaa7b5" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="18">成功後才交付包裹</text>
    <text x="876" y="421" fill="#aaa7b5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">scan · redeem · release</text>
  </g>

  <path d="M366 300h75" stroke="#a7a3bd" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M757 300h75" stroke="#a7a3bd" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="79" y="516" width="655" height="108" rx="24" fill="#171620" stroke="#5f56e8"/>
  <text x="109" y="555" fill="#a9a2ff" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="20" font-weight="700">OID4VP 相容層</text>
  <text x="109" y="590" fill="#d7d4e2" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="20">請求、同意、選擇性揭露、holder binding、direct_post</text>

  <rect x="757" y="516" width="364" height="108" rx="24" fill="#171620" stroke="#d88a32"/>
  <text x="787" y="555" fill="#ffbb70" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="20" font-weight="700">服務自訂層</text>
  <text x="787" y="590" fill="#d7d4e2" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="20">交易 JWT、QR 圖檔、POS 兌換語意</text>
</svg>
