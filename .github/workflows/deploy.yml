name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: "https://pro.mashbean.net"
      BASE_PATH: "/"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        # 站台長到 36MB / 159 頁之後，Pages 端的 deployment_in_progress
        # 常常超過這個 action 的 10 分鐘等待上限，於是 deploy job 標紅、
        # 但部署其實在它放棄之後才完成（2026-08-06 連四次如此，build
        # 全部 success，live URL 最後也都正常）。
        # timeout 這個 input 調不動——傳超過 600000 會被 action 夾回
        # 600000 並印 warning，所以先不要再試著加大它。
        # deploy 標紅時的正確處置是直接驗 live URL，不要盲目重跑。
        uses: actions/deploy-pages@v4
